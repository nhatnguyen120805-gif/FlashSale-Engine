server:
  port: 0

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:flashsale_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

flashsale:
  rabbitmq:
    exchange: flashsale.order.exchange
    queue: flashsale.order.create.queue
    routing-key: flashsale.order.create
    dlx-exchange: flashsale.order.dlx.exchange
    dlq-queue: flashsale.order.dlq.queue
    dlq-routing-key: flashsale.order.dlq
    delay-queue: flashsale.order.delay.queue
    delay-routing-key: flashsale.order.delay
    expired-queue: flashsale.order.expired.queue
    expired-routing-key: flashsale.order.expired
  order:
    expiration-ttl-ms: 300000
  outbox:
    poll-interval-ms: 5000
    scheduler-enabled: false
  rate-limit:
    capacity: 1000
    refill-tokens-per-second: 1000
  idempotency:
    ttl-seconds: 3600
